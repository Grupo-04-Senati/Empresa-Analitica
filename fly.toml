# fly.toml app configuration file generated for empresa-analitica on 2026-09-08T22:06:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'empresa-analitica'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
